<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ClassFellow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090D16;
            --bg-card: #0F172A;
            --border-color: #334155;
            --emerald-500: #10B981;
            --emerald-400: #34D399;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --slate-50: #F8FAFC;
            --slate-400: #94A3B8;
            --rose-bg: rgba(244, 63, 94, 0.15);
            --rose-500: #F43F5E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--slate-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.08), transparent 60%);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 40px 36px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--emerald-500), #064E3B);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 20px var(--emerald-glow);
        }

        .login-brand h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .login-brand p {
            font-size: 0.84rem;
            color: var(--slate-400);
            margin-top: 4px;
        }

        .alert-error {
            background-color: var(--rose-bg);
            border: 1px solid var(--rose-500);
            color: #FECDD3;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--slate-400);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-control {
            width: 100%;
            background-color: #090D16;
            border: 1px solid var(--border-color);
            color: var(--slate-50);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--emerald-500);
            box-shadow: 0 0 0 3px var(--emerald-glow);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--emerald-500), #059669);
            color: #FFFFFF;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--emerald-glow);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--emerald-400), var(--emerald-500));
            transform: translateY(-1px);
        }

        .roles-hint {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .roles-hint span {
            font-size: 0.75rem;
            color: var(--slate-400);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .role-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .role-tag {
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--slate-400);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="login-icon">🎓</div>
            <h1>ClassFellow</h1>
            <p>Institutional Authentication Gateway</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="/accounts/login/">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <input class="form-control" type="text" id="id_username" name="username" value="{{ username }}" required autofocus autocomplete="username" placeholder="e.g. admin">
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input class="form-control" type="password" id="id_password" name="password" required autocomplete="current-password" placeholder="Enter password">
            </div>

            <button type="submit" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <div class="roles-hint">
            <span>Institutional Security Profiles</span>
            <div class="role-tags">
                <div class="role-tag">Admin</div>
                <div class="role-tag">Principal</div>
                <div class="role-tag">Cashier</div>
            </div>
        </div>
    </div>
</body>
</html>
