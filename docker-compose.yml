version: '3.8'

# =============================================================================
# ClassFellow Web - Production Multi-Container Staging Stack (Category 17)
# Orchestrates Django 5 Web, PostgreSQL 16 Database, and Nginx Reverse Proxy
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: classfellow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classfellow_prod}
      POSTGRES_USER: ${POSTGRES_USER:-classfellow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ClassFellow2026Secure!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classfellow_user} -d ${POSTGRES_DB:-classfellow_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - classfellow_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classfellow_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-classfellow-production-secret-key-change-in-env-2026}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,classfellow_web}
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-classfellow_prod}
      POSTGRES_USER: ${POSTGRES_USER:-classfellow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ClassFellow2026Secure!}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      INSTITUTION_SYNC_TOKEN: ${INSTITUTION_SYNC_TOKEN:-classfellow-sync-secret-token-2026}
    volumes:
      - static_volume:/app/classfellow_web/staticfiles
      - media_volume:/app/classfellow_web/media
      - backup_volume:/app/data/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - classfellow_net

  nginx:
    image: nginx:1.25-alpine
    container_name: classfellow_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    networks:
      - classfellow_net

volumes:
  pgdata:
    name: classfellow_pgdata
  static_volume:
    name: classfellow_static_volume
  media_volume:
    name: classfellow_media_volume
  backup_volume:
    name: classfellow_backup_volume

networks:
  classfellow_net:
    name: classfellow_network
    driver: bridge
