# =============================================================================
# ClassFellow Web - Production Nginx Reverse Proxy Configuration (Category 17)
# Reverse proxy, SSL termination, static/media delivery, and health probe bypass
# =============================================================================

upstream classfellow_upstream {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Gzip Compression for static text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Serve static assets directly from shared volume
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Serve uploaded media directly from shared volume
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Direct health probe route without verbose logging
    location /health/ {
        proxy_pass http://classfellow_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Primary application proxy
    location / {
        proxy_pass http://classfellow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
